name: Build Windows RT ARM firmware

on:
  push:
    branches:
      - edk2-stable202411-winrt
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_set:
        description: 'release/debug: 4 NoBGRT variants; full: all 16 variants'
        type: choice
        default: release
        options:
          - release
          - debug
          - full

permissions:
  contents: read

concurrency:
  group: winrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ARM firmware bundle / ${{ inputs.build_set || 'release' }}
    runs-on: ubuntu-24.04
    env:
      BUILD_SET: ${{ inputs.build_set || 'release' }}
      WINRT_BOOT_BATTERY: 'TRUE'
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            acpica-tools nasm uuid-dev python3

      - name: Build and package firmware variants
        run: |
          set -euo pipefail
          # Pushes build only the release NoBGRT set. The full set is opt-in.
          targets=(RELEASE)
          graphics=(nobgrt)
          case "$BUILD_SET" in
            release) ;;
            debug) targets=(DEBUG) ;;
            full) targets=(RELEASE DEBUG); graphics=(nobgrt bgrt) ;;
            *) echo "Unknown build set: $BUILD_SET" >&2; exit 2 ;;
          esac

          export WORKSPACE="$GITHUB_WORKSPACE"
          export EDK_TOOLS_PATH="$WORKSPACE/BaseTools"
          export CONF_PATH="$WORKSPACE/Conf"
          export PYTHONPATH="$EDK_TOOLS_PATH/Source/Python"
          export PYTHON_COMMAND=python3
          export GCC5_ARM_PREFIX=/usr/bin/arm-none-eabi-
          export IASL_PREFIX=/usr/bin/
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$EDK_TOOLS_PATH/Source/C/bin:$PATH"

          mkdir -p "$CONF_PATH" logs dist
          for config in target tools_def build_rule; do
            cp "BaseTools/Conf/$config.template" "$CONF_PATH/$config.txt"
          done

          make -C BaseTools/Source/C -j2 \
            'CC=gcc -std=gnu11' EXTRA_OPTFLAGS=-Wno-error \
            GenFfs GenFv GenFw GenSec LzmaCompress TianoCompress VfrCompile \
            2>&1 | tee logs/build-basetools.log

          revision=$(git rev-parse HEAD)
          {
            arm-none-eabi-gcc --version
            python3 --version
          } > logs/toolchain.txt
          {
            printf 'Build set: **%s**, battery enabled in every variant.\n\n' "$BUILD_SET"
            printf '| Firmware directory | Build time (seconds) |\n| --- | ---: |\n'
          } >> "$GITHUB_STEP_SUMMARY"

          for PLATFORM_VARIANT in virt legacy-tegra2; do
            case "$PLATFORM_VARIANT" in
              virt)
                WINRT_RAM_BASE=0x40000000
                WINRT_LEGACY_TEGRA2=FALSE
                WINRT_OUTPUT_DIRECTORY=Build/ArmVirtQemuWinRt-ARM
                ;;
              legacy-tegra2)
                WINRT_RAM_BASE=0x80000000
                WINRT_LEGACY_TEGRA2=TRUE
                WINRT_OUTPUT_DIRECTORY=Build/ArmVirtQemuWinRt-Legacy
                ;;
            esac
            for BUILD_TARGET in "${targets[@]}"; do
              # Reuse module objects for display/BGRT variants of this platform.
              # Keep AutoGen enabled so changed defines/PCDs are regenerated.
              for DISPLAY_VARIANT in edid-capped all-modes; do
                WINRT_LIMIT_DISPLAY=FALSE
                if [[ "$DISPLAY_VARIANT" == edid-capped ]]; then
                  # Cap GOP at the xres/yres EDID hint (1024x768 fallback).
                  WINRT_LIMIT_DISPLAY=TRUE
                fi
                for BGRT_VARIANT in "${graphics[@]}"; do
                  WINRT_BGRT=FALSE
                  if [[ "$BGRT_VARIANT" == bgrt ]]; then
                    WINRT_BGRT=TRUE
                  fi
                  variant="winrt-${BUILD_TARGET}-${DISPLAY_VARIANT}-battery-${BGRT_VARIANT}-${PLATFORM_VARIANT}"
                  echo "::group::Build $variant"
                  started=$SECONDS
                  python3 BaseTools/Source/Python/build/build.py \
                    -p ArmVirtPkg/ArmVirtQemuWinRt.dsc \
                    -a ARM -b "$BUILD_TARGET" -t GCC5 -n 2 \
                    -D NETWORK_ENABLE=FALSE -D TPM2_ENABLE=FALSE \
                    -D FD_SIZE_IN_MB=3 -D WINRT_SD_IO_ALIGN=0 \
                    -D WINRT_UNCACHED_RAM=TRUE \
                    -D "WINRT_LIMIT_DISPLAY=$WINRT_LIMIT_DISPLAY" \
                    -D "WINRT_BOOT_BATTERY=$WINRT_BOOT_BATTERY" \
                    -D "WINRT_RAM_BASE=$WINRT_RAM_BASE" \
                    -D "WINRT_LEGACY_TEGRA2=$WINRT_LEGACY_TEGRA2" \
                    -D "WINRT_OUTPUT_DIRECTORY=$WINRT_OUTPUT_DIRECTORY" \
                    -D "WINRT_BGRT=$WINRT_BGRT" \
                    2>&1 | tee "logs/${variant}.log"
                  elapsed=$((SECONDS - started))
                  echo '::endgroup::'

                  # Save each FD before the next variant reuses its build tree.
                  firmware_dir="${WINRT_OUTPUT_DIRECTORY}/${BUILD_TARGET}_GCC5/FV"
                  artifact_dir="dist/$variant"
                  mkdir -p "$artifact_dir"
                  cp "$firmware_dir/QEMU_EFI.fd" "$firmware_dir/QEMU_VARS.fd" "$artifact_dir/"
                  (
                    cd "$artifact_dir"
                    sha256sum QEMU_EFI.fd QEMU_VARS.fd > SHA256SUMS
                  )
                  {
                    printf '%s\nBUILD_SET=%s\nBUILD_TARGET=%s\n' "$revision" "$BUILD_SET" "$BUILD_TARGET"
                    printf 'DISPLAY_VARIANT=%s\nWINRT_LIMIT_DISPLAY=%s\n' \
                      "$DISPLAY_VARIANT" "$WINRT_LIMIT_DISPLAY"
                    printf 'WINRT_BOOT_BATTERY=%s\nBGRT_VARIANT=%s\nWINRT_BGRT=%s\n' \
                      "$WINRT_BOOT_BATTERY" "$BGRT_VARIANT" "$WINRT_BGRT"
                    printf 'PLATFORM=%s\nWINRT_RAM_BASE=%s\nWINRT_LEGACY_TEGRA2=%s\nWINRT_OUTPUT_DIRECTORY=%s\n' \
                      "$PLATFORM_VARIANT" "$WINRT_RAM_BASE" \
                      "$WINRT_LEGACY_TEGRA2" "$WINRT_OUTPUT_DIRECTORY"
                    if [[ "$WINRT_LEGACY_TEGRA2" == TRUE ]]; then
                      printf 'QEMU_MACHINE_ARGS=%s\nQEMU_MAX_RAM=%s\n' \
                        'virt,winrt=on,highmem=off,gic-version=2,winrt-sp804=off,winrt-tegra-timer=on,winrt-legacy-ram=on,winrt-tegra2=on' \
                        '1G'
                    fi
                    printf 'QEMU_RNG_ARGS=%s\n' \
                      '-object rng-builtin,id=host-rng -device virtio-rng-device,rng=host-rng'
                    cat logs/toolchain.txt
                  } > "$artifact_dir/build-info.txt"
                  printf '| `%s` | %s |\n' "$variant" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
                done
              done
            done
          done

      - name: Upload firmware
        if: ${{ !cancelled() && hashFiles('dist/**/SHA256SUMS') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: edk2-winrt-ARM-${{ env.BUILD_SET }}-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: edk2-winrt-ARM-${{ env.BUILD_SET }}-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
