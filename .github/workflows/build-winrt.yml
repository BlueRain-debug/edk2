name: Build Windows RT ARM firmware

on:
  push:
    branches:
      - edk2-stable202411-winrt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ARM / ${{ matrix.target }} / ${{ matrix.display.name }} / battery / ${{ matrix.graphics.name }} / ${{ matrix.platform.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [DEBUG, RELEASE]
        display:
          # Cap GOP modes at QEMU's xres/yres EDID hint (1024x768 fallback).
          - name: edid-capped
            limit: 'TRUE'
          - name: all-modes
            limit: 'FALSE'
        # Battery support is shared by all 16 combinations.
        graphics:
          - name: bgrt
            enabled: 'TRUE'
          - name: nobgrt
            enabled: 'FALSE'
        platform:
          - name: virt
            ram_base: '0x40000000'
            legacy_tegra2: 'FALSE'
            output: Build/ArmVirtQemuWinRt-ARM
          - name: legacy-tegra2
            ram_base: '0x80000000'
            legacy_tegra2: 'TRUE'
            output: Build/ArmVirtQemuWinRt-Legacy
    env:
      BUILD_TARGET: ${{ matrix.target }}
      DISPLAY_VARIANT: ${{ matrix.display.name }}
      WINRT_LIMIT_DISPLAY: ${{ matrix.display.limit }}
      WINRT_BOOT_BATTERY: 'TRUE'
      BGRT_VARIANT: ${{ matrix.graphics.name }}
      WINRT_BGRT: ${{ matrix.graphics.enabled }}
      PLATFORM_VARIANT: ${{ matrix.platform.name }}
      WINRT_RAM_BASE: ${{ matrix.platform.ram_base }}
      WINRT_LEGACY_TEGRA2: ${{ matrix.platform.legacy_tegra2 }}
      WINRT_OUTPUT_DIRECTORY: ${{ matrix.platform.output }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            acpica-tools nasm uuid-dev python3

      - name: Build WinRT firmware
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export EDK_TOOLS_PATH="$WORKSPACE/BaseTools"
          export CONF_PATH="$WORKSPACE/Conf"
          export PYTHONPATH="$EDK_TOOLS_PATH/Source/Python"
          export PYTHON_COMMAND=python3
          export GCC5_ARM_PREFIX=/usr/bin/arm-none-eabi-
          export IASL_PREFIX=/usr/bin/
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$EDK_TOOLS_PATH/Source/C/bin:$PATH"

          mkdir -p "$CONF_PATH"
          for config in target tools_def build_rule; do
            cp "BaseTools/Conf/$config.template" "$CONF_PATH/$config.txt"
          done

          make -C BaseTools/Source/C -j2 \
            'CC=gcc -std=gnu11' EXTRA_OPTFLAGS=-Wno-error \
            GenFfs GenFv GenFw GenSec LzmaCompress TianoCompress VfrCompile \
            2>&1 | tee build-basetools.log

          python3 BaseTools/Source/Python/build/build.py \
            -p ArmVirtPkg/ArmVirtQemuWinRt.dsc \
            -a ARM -b "$BUILD_TARGET" -t GCC5 -n 2 \
            -D NETWORK_ENABLE=FALSE -D TPM2_ENABLE=FALSE \
            -D FD_SIZE_IN_MB=3 -D WINRT_SD_IO_ALIGN=0 \
            -D WINRT_UNCACHED_RAM=TRUE \
            -D "WINRT_LIMIT_DISPLAY=$WINRT_LIMIT_DISPLAY" \
            -D "WINRT_BOOT_BATTERY=$WINRT_BOOT_BATTERY" \
            -D "WINRT_RAM_BASE=$WINRT_RAM_BASE" \
            -D "WINRT_LEGACY_TEGRA2=$WINRT_LEGACY_TEGRA2" \
            -D "WINRT_OUTPUT_DIRECTORY=$WINRT_OUTPUT_DIRECTORY" \
            -D "WINRT_BGRT=$WINRT_BGRT" \
            2>&1 | tee build-winrt.log

      - name: Package firmware
        run: |
          set -euo pipefail
          firmware_dir="${WINRT_OUTPUT_DIRECTORY}/${BUILD_TARGET}_GCC5/FV"
          artifact_dir="dist/winrt-${BUILD_TARGET}-${DISPLAY_VARIANT}-battery-${BGRT_VARIANT}-${PLATFORM_VARIANT}"
          mkdir -p "$artifact_dir"
          cp "$firmware_dir/QEMU_EFI.fd" "$firmware_dir/QEMU_VARS.fd" "$artifact_dir/"
          (
            cd "$artifact_dir"
            sha256sum QEMU_EFI.fd QEMU_VARS.fd > SHA256SUMS
          )
          {
            git rev-parse HEAD
            printf 'BUILD_TARGET=%s\nWINRT_LIMIT_DISPLAY=%s\nWINRT_BOOT_BATTERY=%s\n' \
              "$BUILD_TARGET" "$WINRT_LIMIT_DISPLAY" "$WINRT_BOOT_BATTERY"
            printf 'DISPLAY_VARIANT=%s\nBGRT_VARIANT=%s\n' \
              "$DISPLAY_VARIANT" "$BGRT_VARIANT"
            printf 'PLATFORM=%s\nWINRT_RAM_BASE=%s\nWINRT_LEGACY_TEGRA2=%s\nWINRT_OUTPUT_DIRECTORY=%s\n' \
              "$PLATFORM_VARIANT" "$WINRT_RAM_BASE" \
              "$WINRT_LEGACY_TEGRA2" "$WINRT_OUTPUT_DIRECTORY"
            printf 'WINRT_BGRT=%s\n' "$WINRT_BGRT"
            if [[ "$WINRT_LEGACY_TEGRA2" == TRUE ]]; then
              printf 'QEMU_MACHINE_ARGS=%s\nQEMU_MAX_RAM=%s\n' \
                'virt,winrt=on,highmem=off,gic-version=2,winrt-sp804=off,winrt-tegra-timer=on,winrt-legacy-ram=on,winrt-tegra2=on' \
                '1G'
            fi
            if [[ "$WINRT_BOOT_BATTERY" == TRUE ]]; then
              printf 'QEMU_RNG_ARGS=%s\n' \
                '-object rng-builtin,id=host-rng -device virtio-rng-device,rng=host-rng'
            fi
            arm-none-eabi-gcc --version
            python3 --version
          } > "$artifact_dir/build-info.txt"

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: edk2-winrt-ARM-${{ matrix.target }}-${{ matrix.display.name }}-battery-${{ matrix.graphics.name }}-${{ matrix.platform.name }}
          path: dist/winrt-${{ matrix.target }}-${{ matrix.display.name }}-battery-${{ matrix.graphics.name }}-${{ matrix.platform.name }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: edk2-winrt-ARM-${{ matrix.target }}-${{ matrix.display.name }}-battery-${{ matrix.graphics.name }}-${{ matrix.platform.name }}-logs
          path: |
            build-basetools.log
            build-winrt.log
          if-no-files-found: ignore
          retention-days: 14
